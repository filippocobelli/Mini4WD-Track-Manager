name: Release

# Every new version creates a GitHub Release with the .dmg (macOS), the .exe installer + portable (Windows) and the single HTML file.
# Runs when main gets a package.json with a version not released yet (or from a vX.Y.Z tag, or by hand).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        name: Same version in package.json, app/index.html and CHANGELOG
        run: |
          PKG=$(node -p "require('./package.json').version")
          APPV=$(grep -oE 'const APP_VERSION="[^"]+"' app/index.html | cut -d'"' -f2)
          echo "package.json=$PKG app=$APPV ref=$GITHUB_REF"
          test "$PKG" = "$APPV" || (echo "::error::app/index.html has $APPV, package.json has $PKG" && exit 1)
          grep -qE "^## \[?v?$PKG" CHANGELOG.md || (echo "::error::CHANGELOG.md has no $PKG section" && exit 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$PKG" || (echo "::error::Tag $GITHUB_REF_NAME does not match $PKG" && exit 1)
            REL=true
          elif git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null; then
            echo "v$PKG is already released: no build. Bump the version to publish a new one."
            REL=false
          else
            REL=true
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            dist/web/*.html
          if-no-files-found: error

  release:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Release notes from the CHANGELOG
        run: node scripts/release-notes.mjs "${{ needs.check.outputs.version }}" > notes.md
      - name: Collect the files
        run: |
          mkdir -p files
          find out -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} files/ \;
          find out -type f -name '*.html' | head -n 1 | xargs -I{} cp {} files/
          ls -la files
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mini4WD Track Planner v${{ needs.check.outputs.version }}
          body_path: notes.md
          files: files/*

