name: Release

# Ogni versione nuova genera una GitHub Release con .dmg (macOS), .exe installer + portable (Windows) e il file HTML unico.
# Parte quando su main arriva un package.json con una versione non ancora rilasciata (o da un tag vX.Y.Z, o a mano).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Versione unica in package.json, app/index.html e CHANGELOG
        run: |
          PKG=$(node -p "require('./package.json').version")
          APPV=$(grep -oE 'const APP_VERSION="[^"]+"' app/index.html | cut -d'"' -f2)
          echo "package.json=$PKG app=$APPV ref=$GITHUB_REF"
          test "$PKG" = "$APPV" || (echo "::error::app/index.html ha $APPV, package.json ha $PKG" && exit 1)
          grep -qE "^## \[?v?$PKG" CHANGELOG.md || (echo "::error::Manca la sezione $PKG in CHANGELOG.md" && exit 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$PKG" || (echo "::error::Il tag $GITHUB_REF_NAME non coincide con $PKG" && exit 1)
            REL=true
          elif git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null; then
            echo "v$PKG è già stata rilasciata: nessuna build. Aumenta la versione per pubblicarne una nuova."
            REL=false
          else
            REL=true
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            dist/web/*.html
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Note di rilascio dal CHANGELOG
        run: node scripts/release-notes.mjs "${{ needs.check.outputs.version }}" > notes.md
      - name: Raccogli i file
        run: |
          mkdir -p files
          find out -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} files/ \;
          find out -type f -name '*.html' | head -n 1 | xargs -I{} cp {} files/
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mini4WD Track Planner v${{ needs.check.outputs.version }}
          body_path: notes.md
          files: files/*
