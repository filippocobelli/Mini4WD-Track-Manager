name: Test

# Gira su ogni pull request e su ogni push: una proposta entra solo se i test passano.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - name: Versione allineata
        run: |
          PKG=$(node -p "require('./package.json').version")
          APPV=$(grep -oE 'const APP_VERSION="[^"]+"' app/index.html | cut -d'"' -f2)
          test "$PKG" = "$APPV" || (echo "::error::app/index.html ha $APPV, package.json ha $PKG (esegui node scripts/sync-version.mjs)" && exit 1)
      - run: npm test
