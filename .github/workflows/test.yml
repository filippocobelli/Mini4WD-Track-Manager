name: Test

# Runs on every pull request and every push: a change gets in only if the tests pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - name: Versions match
        run: |
          PKG=$(node -p "require('./package.json').version")
          APPV=$(grep -oE 'const APP_VERSION="[^"]+"' app/index.html | cut -d'"' -f2)
          test "$PKG" = "$APPV" || (echo "::error::app/index.html has $APPV, package.json has $PKG (run node scripts/sync-version.mjs)" && exit 1)
      - run: npm test
