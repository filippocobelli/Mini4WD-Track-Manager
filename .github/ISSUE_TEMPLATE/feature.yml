name: Feature request
description: An idea to make the planner or the 3D engine better
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to do, and why?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How could it work? (optional)
      description: Sketches, screenshots or examples from other tools are welcome.
