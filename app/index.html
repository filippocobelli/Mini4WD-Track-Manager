<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini4WD Track Planner</title>
<meta name="apple-mobile-web-app-title" content="Track Planner">
<meta name="application-name" content="Track Planner">
<meta name="theme-color" content="#0b4ea2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"%3E %3Crect width="512" height="512" fill="%23ffffff"/%3E %3Cpath d="M0 0H512V150L0 22Z" fill="%230b4ea2"/%3E %3Cpath d="M0 22L512 150V176L0 48Z" fill="%23e1251b"/%3E %3Cg fill="none" transform="translate%280 30%29"%3E %3Cpath d="M126 512V300A130 130 0 0 1 386 300V512" stroke="%2314213a" stroke-width="152"/%3E %3Cpath d="M91 512V300A165 165 0 0 1 421 300V512" stroke="%23e1251b" stroke-width="58"/%3E %3Cpath d="M161 512V300A95 95 0 0 1 351 300V512" stroke="%230b4ea2" stroke-width="58"/%3E %3Cpath d="M126 512V300A130 130 0 0 1 386 300V512" stroke="%23ffffff" stroke-width="6" stroke-dasharray="22 16"/%3E %3C/g%3E %3Cg transform="translate%2852 400%29"%3E %3Crect width="148" height="36" fill="%2314213a"/%3E %3Cg fill="%23ffffff"%3E %3Crect x="0" y="0" width="18" height="18"/%3E%3Crect x="36" y="0" width="18" height="18"/%3E%3Crect x="72" y="0" width="18" height="18"/%3E%3Crect x="108" y="0" width="18" height="18"/%3E %3Crect x="18" y="18" width="18" height="18"/%3E%3Crect x="54" y="18" width="18" height="18"/%3E%3Crect x="90" y="18" width="18" height="18"/%3E%3Crect x="126" y="18" width="18" height="18"/%3E %3C/g%3E %3C/g%3E %3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="mini4wd-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="mini4wd-icon-180.png">
<link rel="manifest" href="mini4wd.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: building table on the left, data sheet on the right; stacked on phones */
  --bg:#e8ecf0; --surface:#ffffff; --ink:#15202c; --muted:#5a6675; --line:#d3dae2; --accent:#f2b705;
  --lane1:#d7372f; --lane2:#2a6fdb; --track:#fbfcfd; --wall:#6f7b89; --grid:#d9e0e8;
  --ok:#17834a; --warn:#b86e00; --bad:#c42e2e;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#98a4b2; --line:#2b3540; --accent:#f5c22e;
    --lane1:#ef5b50; --lane2:#5a93f0; --track:#242c36; --wall:#a6b1be; --grid:#1c242d;
    --ok:#40c077; --warn:#e3a12c; --bad:#f06767; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#98a4b2; --line:#2b3540; --accent:#f5c22e;
  --lane1:#ef5b50; --lane2:#5a93f0; --track:#242c36; --wall:#a6b1be; --grid:#1c242d;
  --ok:#40c077; --warn:#e3a12c; --bad:#f06767; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-anchor:none}
.pane{overflow-anchor:none}
.pane>*{flex-shrink:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:0;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 16px 8px}
h1{font:700 26px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--muted);font-weight:600}
.src{color:var(--muted);font-size:12.5px;margin:0}
.kofi{margin-left:auto;align-self:center;font:600 13px/1 var(--body);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface);white-space:nowrap}
.kofi:hover{border-color:var(--accent)}
.langbtn{align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font:700 13px/1 var(--display);letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.ver{font:500 12px/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 6px;align-self:center}
.stage{position:relative;height:58svh;min-height:300px;margin:0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#cv:active{cursor:grabbing}
#v3{position:absolute;inset:0;display:none;touch-action:none}
#v3 canvas{display:block;width:100%;height:100%}
.stage.is3d #cv{display:none}
.stage.is3d #v3{display:block}
.stage.is3d .only2d{display:none}
#vw{position:absolute;inset:0;display:none;touch-action:none}
#vw canvas{display:block;width:100%;height:100%}
.stage.isws #cv,.stage.isws #v3,.stage.isws .only2d,.stage.isws .mode,.stage.isws .hud{display:none}
.stage.isws #vw{display:block}
.stage.isws .tip3d{display:block}
details.box{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.box summary{cursor:pointer;font-weight:600}
details.box[open] summary{margin-bottom:10px}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 120px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 12.5px/1.2 var(--mono);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--ok)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}
.mode{position:absolute;right:10px;top:10px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font:700 15px/1 var(--display);letter-spacing:.06em;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.vbtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.vbtns button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 17px/1 var(--mono)}
.tip3d{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:none}
.stage.is3d .tip3d{display:block}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;align-items:stretch}
.sep{flex:0 0 auto;display:flex;align-items:center;padding:0 2px 0 8px;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);border-right:2px solid var(--line)}
.pb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:58px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pb svg{width:30px;height:22px}
.pb b{font:700 15px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pb small{font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.pb.x{border-style:dashed}
.pb:hover{border-color:var(--ink)}
.pb:active{transform:translateY(1px)}
.ab{flex:0 0 auto;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;white-space:nowrap}
.ab:hover:not(:disabled){background:var(--surface)}
.ab:disabled{opacity:.4;cursor:default}
.ab.danger{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{margin:0 16px 24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;padding:11px 5px;border:0;background:transparent;cursor:pointer;font:700 14px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font:700 17px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font:500 18px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.status{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:5px}
.status.ok{border-left-color:var(--ok)} .status.warn{border-left-color:var(--warn)} .status.bad{border-left-color:var(--bad)}
.status b{display:block}
.status p{margin:2px 0 0;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{padding:6px 10px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer;font:500 12.5px var(--mono)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--mono)}
tfoot td{font-weight:600;border-bottom:0}
.tw{overflow-x:auto}
.chip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;font:500 10.5px/1.5 var(--mono);background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);vertical-align:1px;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=number]{width:78px;font-family:var(--mono);text-align:right}
textarea{width:100%;min-height:110px;font:12px/1.4 var(--mono)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:65ch}
.models{display:flex;flex-direction:column;gap:10px}
.model{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.model b{font-weight:600}
.model small{color:var(--muted)}
.model p{margin:0;grid-column:1/-1;font-size:13px}
.model a.btn{height:32px;font-size:13px}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font:600 15px/1 var(--mono)}
.qty input{width:60px}
.log{list-style:none;margin:0;padding:0 8px 0 0;display:flex;flex-direction:column;max-height:calc(5 * 2.6rem);overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.log li{min-height:2.6rem;box-sizing:border-box}
.log li:last-child{border-bottom:0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.log time{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.log .pos{color:var(--ok);font-family:var(--mono)} .log .neg{color:var(--bad);font-family:var(--mono)}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feats label{position:relative;display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--bg)}
.feats input{position:absolute;opacity:0;pointer-events:none}
.feats label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.feats label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card svg{width:100%;height:110px;background:var(--bg);border-radius:6px}
.card h3{margin:0;font:700 17px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.card .meta{font:12.5px/1.4 var(--mono);color:var(--muted)}
.card .bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--warn) 35%,transparent);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--ok)}
.card ul{margin:0;padding-left:18px;font-size:12.5px}
.card .btn{margin-top:auto;justify-content:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
/* SVG */
.gridl{stroke:var(--grid);stroke-width:2;fill:none}
.body{fill:var(--track);stroke:var(--wall);stroke-width:6;stroke-linejoin:round}
.elev .body{stroke-dasharray:24 10}
.l1{fill:var(--lane1);fill-opacity:.2}
.l2{fill:var(--lane2);fill-opacity:.2}
.div{stroke:var(--wall);stroke-width:4;fill:none}
.joint{stroke:var(--wall);stroke-width:3;stroke-dasharray:8 6}
.lbl{font:600 40px var(--display);fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.04em}
.x1{stroke:var(--lane1);stroke-width:12;fill:none;stroke-linecap:round}
.x2{stroke:var(--lane2);stroke-width:12;fill:none;stroke-linecap:round}
.bridge{fill:var(--wall);fill-opacity:.18;stroke:var(--wall);stroke-width:3;stroke-dasharray:10 6}
.feat{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:3}
.sel .body{stroke:var(--accent);stroke-width:14;stroke-dasharray:none}
.cursor{fill:var(--accent);stroke:var(--ink);stroke-width:4}
.start{stroke:var(--ink);stroke-width:14;stroke-dasharray:14 14}
.gap{stroke:var(--bad);stroke-width:5;stroke-dasharray:16 12;fill:none}
.empty{font:600 46px var(--display);fill:var(--muted);text-anchor:middle}
.sketch{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9}
.sketch.fit{stroke-dasharray:6 6;opacity:.75}
.stage.isdraw #cv{cursor:crosshair}
.stage.isdraw{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ab.on{background:var(--accent);border-color:var(--accent);color:#15202c}
.ab.sm{height:28px;padding:0 9px;font-size:12px;display:inline-flex;align-items:center;text-decoration:none}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
@media (min-width:980px){
  .app{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto 1fr auto;height:100%}
  header{grid-column:1/3}
  .stage{grid-column:1;grid-row:2;height:auto;min-height:0;margin-right:8px}
  .tools{grid-column:1;grid-row:3;position:static;padding-bottom:16px}
  .panel{grid-column:2;grid-row:2/4;margin:0 16px 16px 8px;display:flex;flex-direction:column;min-height:0}
  .pane{overflow:auto;flex:1}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mini4WD <span>Track Planner</span></h1>
    <span class="ver" id="ver" title="Version"></span>
    <p class="src" id="src"></p>
    <a class="kofi" id="kofi" href="https://ko-fi.com/filippocobelli" target="_blank" rel="noopener">☕ Ko-fi</a>
    <button class="langbtn" id="lang" type="button" aria-label="Lingua / Language"></button>
  </header>

  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" data-en-aria="Track plan" aria-label="Pianta del circuito"></svg>
    <div id="v3" data-en-aria="3D view of the track" aria-label="Vista 3D del circuito"></div>
    <div id="vw" data-en-aria="3D preview of the piece to print" aria-label="Anteprima 3D del pezzo da stampare"></div>
    <div class="hud" id="hud"></div>
    <div class="mode" role="group" aria-label="Vista" data-en-aria="View">
      <button id="m2d" aria-pressed="true">2D</button>
      <button id="m3d" aria-pressed="false">3D</button>
    </div>
    <div class="vbtns">
      <button id="zin" class="only2d" title="Ingrandisci" aria-label="Ingrandisci" data-en-title="Zoom in" data-en-aria="Zoom in">+</button>
      <button id="zout" class="only2d" title="Riduci" aria-label="Riduci" data-en-title="Zoom out" data-en-aria="Zoom out">−</button>
      <button id="zfit" title="Adatta vista" aria-label="Adatta vista" data-en-title="Fit view" data-en-aria="Fit view">⤢</button>
    </div>
    <div class="tip3d" data-en="Drag to rotate · two fingers or wheel to zoom">Trascina per ruotare · due dita o rotella per zoom</div>
  </div>

  <div class="tools">
    <div class="row" id="pieces" aria-label="Aggiungi pezzo" data-en-aria="Add piece"></div>
    <div class="row">
      <button class="ab" id="draw" data-en="✏️ Draw">✏️ Disegna</button>
      <button class="ab" id="imgbtn" data-en="🖼 Image">🖼 Immagine</button>
      <input type="file" id="imgfile" accept="image/*" hidden>
      <button class="ab" id="undo" data-en="↶ Undo">↶ Annulla</button>
      <button class="ab" id="redo" data-en="↷ Redo">↷ Ripeti</button>
      <button class="ab" id="flip" data-en="⇄ Flip curve">⇄ Inverti curva</button>
      <button class="ab" id="flipv" data-en="⇅ Up/down">⇅ Salita/discesa</button>
      <button class="ab" id="rot" data-en="⟳ Rotate 45°">⟳ Ruota 45°</button>
      <button class="ab" id="desel" data-en="Track end">Fine pista</button>
      <button class="ab danger" id="del">✕ Elimina</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="sum" data-en="Summary">Riepilogo</button>
      <button role="tab" data-tab="bom" data-en="Parts">Pezzi</button>
      <button role="tab" data-tab="inv" data-en="Inventory">Magazzino</button>
      <button role="tab" data-tab="gen" data-en="Ideas">Idee</button>
      <button role="tab" data-tab="ws" data-en="Workshop">Officina</button>
      <button role="tab" data-tab="mod" data-en="Models">Modelli</button>
      <button role="tab" data-tab="cat" data-en="Catalogue">Catalogo</button>
      <button role="tab" data-tab="file" data-en="Tracks">Circuiti</button>
    </div>
    <div class="pane" id="pane"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="engine3d.js"></script>
<script src="trace.js"></script>
<script>

const off=(p,o)=>({x:p.x-o*Math.sin(p.h),y:p.y+o*Math.cos(p.h),h:p.h});

function bbox(g){

const normDeg=d=>{d=((d%360)+540)%360-180;return Math.abs(d+180)<1e-6?180:d;};

function analyse(g){

  if(DL){
    let fn=name,data=bytes;
    if(!/\.(zip|txt|json|svg|html|csv)$/i.test(name)){fn=name.replace(/\.[^.]+$/,"")+".zip";data=M4Engine.zip([{name,data:bytes}]);}
    try{await DL.save({filename:fn,data});toast(L(`Salvato «${fn}»`,`Saved «${fn}»`));}
    catch(e){if(!e||e.code!=="declined")toast(L("Download non riuscito qui: usa l'app desktop o la versione web.","Download failed here: use the desktop app or the web version."));}
    return;
  }
  try{const url=URL.createObjectURL(new Blob([bytes],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(L(`Scaricato «${name}»`,`Downloaded «${name}»`));}
  catch(e){toast(L("Il download non è consentito qui: usa l'app desktop o la versione web.","Downloads aren't allowed here: use the desktop app or the web version."));}
}
function specOf(t){
  if(t.gen)return t.gen.spec;
  if(t.kind==="lane"||t.prof==="wall"||(t.kind==="curve"&&t.ang>=270))return null;
  if(t.kind==="curve")return{type:"curve",ang:t.ang,R:t.r};
  if(t.dz)return{type:"ramp",L:t.len,h:t.dz};
  if(t.prof==="hill")return{type:"hill",L:t.len,h:t.hh||60};
  if(t.prof==="jump")return{type:"jump",L:t.len};
  if(t.prof==="saddle")return{type:"saddle",L:t.len};
  if(t.prof==="washboard")return{type:"washboard",L:t.len};
  return{type:"straight",L:t.len};
}
function wsAddToCatalog(){
  const r=wsRes;if(!r)return;const s=wsSpec(),uid=Date.now().toString(36),parts={},prm=JSON.parse(JSON.stringify(wsCfg().prm));

    r.pieces.forEach((p,i)=>{const pid="g"+uid+i;st.parts.push({id:pid,name:p.label,kit:0,h:Math.round(p.volume*0.0129*100)/100,est:true});parts[pid]=p.qty;});
    const t={id:"G"+uid,custom:true,gen:{spec:s,prm},parts,segs:r.pieces.reduce((a,p)=>a+p.qty,0)};
    const N=x=>nf(x);
    const WS=L("Officina","Workshop"),TN=M4Engine.TYPES[s.type].name;
    if(s.type==="curve")Object.assign(t,{kind:"curve",ang:s.ang,r:s.R,label:`${N(s.ang)}°`,name:`${TN} ${N(s.ang)}° R${N(s.R)} (${WS})`});
    else if(s.type==="ramp")Object.assign(t,{kind:"straight",len:s.L,dz:s.h,prof:"ramp",label:TN,name:`${TN} ${N(s.L)}×${N(s.h)} (${WS})`});
    else if(s.type==="hill")Object.assign(t,{kind:"straight",len:s.L,prof:"hill",hh:s.h,label:TN,name:`${TN} ${N(s.L)}×${N(s.h)} (${WS})`});
    else if(s.type==="straight")Object.assign(t,{kind:"straight",len:s.L,label:N(s.L),name:`${TN} ${N(s.L)} (${WS})`});
    else Object.assign(t,{kind:"straight",len:s.L,prof:s.type,label:TN,name:`${TN} ${N(s.L)} (${WS})`});
    st.types.push(t);
  });
  toast(L("Aggiunto alla barra pezzi (gruppo «Miei»)","Added to the piece bar («Mine» group)"));
}
async function wsZip(missing){
  if(!st.layout.length){toast(L("Il circuito è vuoto.","The track is empty."));return;}
  const T0=typeMap(),cnt0={};for(const it of st.layout)cnt0[it.t]=(cnt0[it.t]||0)+1;
  if(missing){const need=bom(),miss={};for(const k in need)miss[k]=Math.max(0,need[k]-(+st.owned[k]||0));
    for(const id of Object.keys(cnt0)){const t=T0[id];if(!t){delete cnt0[id];continue;}let n=cnt0[id];for(const[p,q]of Object.entries(t.parts))n=Math.min(n,Math.floor((miss[p]||0)/q));for(const[p,q]of Object.entries(t.parts))miss[p]-=n*q;if(n)cnt0[id]=n;else delete cnt0[id];}
    if(!Object.keys(cnt0).length&&AN.supports<=(+st.owned.support||0)){toast(L("Hai già tutti i pezzi in magazzino.","You already have every piece in stock."));return;}}
  toast(L("Genero i file del circuito…","Building the track files…"));await new Promise(r=>setTimeout(r,30));
  let E;try{E=await engine();}catch(e){engErr=e.message;wsUpdate();toast(L("Il motore 3D non è partito.","The 3D engine didn't start."));return;}
  const T=T0,counts=cnt0,files=[],lines=[],skipped=[];
  for(const[id,n]of Object.entries(counts)){
    const t=T[id];if(!t)continue;const spec=specOf(t);
    if(!spec){const m=MODELS.find(x=>x.types.includes(id));skipped.push(`${n} × ${tn(t)}${m?` → ${m.url}`:""}`);continue;}
    const r=E.build(spec,wsPrm(t.gen?t.gen.prm:null));
    for(const p of r.pieces){const q=p.qty*n;files.push({name:`${q}x_${fname(p.label)}.stl`,data:M4Engine.toSTL(p.mesh,p.label)});lines.push(`${q} × ${p.label}  (${p.size.map(x=>nf(x)).join(" × ")} mm${p.fit.ok?"":L(", NON entra nel piatto",", does NOT fit the bed")})`);}
  }
  const hs={};let supLeft=missing?Math.max(0,AN.supports-(+st.owned.support||0)):Infinity;
  for(const e of geom().els.slice().sort((a,b)=>b.z0-a.z0))if(e.z0>0.5&&supLeft>0){const h=Math.round(e.z0);hs[h]=(hs[h]||0)+1;supLeft--;}
  for(const[h,n]of Object.entries(hs)){const p=E.build({type:"support",hs:+h,d:20},wsPrm()).pieces[0];files.push({name:`${n}x_${fname(p.label)}.stl`,data:M4Engine.toSTL(p.mesh,p.label)});lines.push(`${n} × ${p.label}`);}
  const txt=[`${st.name||L("Circuito","Track")} — Mini4WD Track Planner v${APP_VERSION}`,`${L("Piatto","Bed")}: ${wsCfg().bed.replace("x","×")} mm`,"",L("DA STAMPARE","TO PRINT"),...lines,"",`${L("Clip Tamiya","Tamiya clips")}: ${AN.clips}`,...(skipped.length?["",L("DA MODELLI MAKERWORLD (non generati)","FROM MAKERWORLD MODELS (not generated)"),...skipped]:[]),"",L("Pezzi generati con licenza MIT. Il profilo è quello del rettilineo da 200 mm del set MINI4WD 2 LANE DIY TRACK (MakerWorld 542904).","Pieces generated under the MIT licence. The profile is the 200 mm straight of the MINI4WD 2 LANE DIY TRACK set (MakerWorld 542904).")].join("\r\n");
  files.push({name:L("LEGGIMI.txt","README.txt"),data:txt});
  download(`${fname(st.name||L("circuito","track"))}${missing?L("_mancanti","_missing"):""}_v${APP_VERSION}_stl.zip`,M4Engine.zip(files),"application/zip");
}

// Runs the fit on a closed sketch (points in mm) and loads the result in the plan.
function runFit(pts,src){
  const lc=st.types.find(t=>t.kind==="lane");
  const res=M4Trace.fitPath(pts,solverCat(true),{lc:st.settings.fitLC&&lc?{id:lc.id,len:lc.len}:null,allowCustom:st.settings.fitCustom,tol:Math.min(st.settings.tol,1.5)});
  if(res.err){toast(res.err==="short"?L("Disegno troppo piccolo: la pista va disegnata in scala reale (ogni quadretto è 10 cm).","Drawing too small: draw the track at real scale (each grid square is 10 cm)."):L("Non riesco a ricostruire il tracciato con i pezzi.","I can't rebuild this layout with the pieces."));return false;}
  const dx=-res.start.x,dy=-res.start.y;
  OV.path=res.sketch.filter((_,i)=>i%2===0).map(p=>({x:p.x+dx,y:p.y+dy}));
  if(OV.img){OV.img.x+=dx;OV.img.y+=dy;}
  if(IMG){IMG.ox=(IMG.ox||0)+dx;IMG.oy=(IMG.oy||0)+dy;}
  commit(()=>{st.layout=toLayout(res.items);st.settings.startH=Math.round(res.start.h/DEG*100)/100;st.name=src==="image"?(IMG&&IMG.name)||L("Da immagine","From image"):L("Dal disegno","From drawing");sel=null;});
  FIT={n:res.items.length,open:res.open,dev:res.dev,custom:res.custom,lc:res.lc,src};
  tab="gen";render();fit();
  toast(res.open?L("Tracciato ricostruito, ma non si chiude: vedi «Riepilogo».","Layout rebuilt, but it doesn't close: see «Summary»."):L(`Tracciato ricostruito con ${res.items.length} pezzi`,`Layout rebuilt with ${res.items.length} pieces`));
  return true;
}
// Image: the centre line is found in a reduced copy (max 500 px), then scaled to the real width.
function importImage(href,name){
  const im=new Image();
  im.onload=()=>{
    const k=Math.min(1,500/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    let d;try{d=x.getImageData(0,0,w,h).data;}catch(e){toast(L("Non riesco a leggere l'immagine.","I can't read the image."));return;}
    const tr=M4Trace.traceImage(d,w,h);
    if(tr.err){toast(L("Non trovo un tracciato nell'immagine: serve un disegno con la pista ben visibile sullo sfondo.","I can't find a layout in the image: it needs a drawing with the track clearly visible on the background."));return;}
    IMG={href,name:(name||"").replace(/\.[^.]+$/,""),w,h,tr};
    if(!st.settings.imgW)st.settings.imgW=Math.round(+st.settings.roomW||300);
    fitImage();
  };
  im.onerror=()=>toast(L("Formato immagine non supportato.","Image format not supported."));
  im.src=href;
}
function fitImage(){
  if(!IMG)return;
  const tr=IMG.tr,sc=st.settings.imgW*10/Math.max(1,tr.bbox.w),ox=-tr.bbox.x0*sc,oy=-tr.bbox.y0*sc;
  OV.img={href:IMG.href,x:ox,y:oy,w:IMG.w*sc,h:IMG.h*sc};IMG.ox=0;IMG.oy=0;
  runFit(tr.pts.map(p=>({x:p.x*sc+ox,y:p.y*sc+oy})),"image");
}

  else if(a==="gen"){genRes=generate();renderPane();if(!genRes.length)toast(L("Nessun tracciato entra nello spazio indicato.","No layout fits in the given space."));}
  else if(a==="copy-bom"){const need=bom();const lines=st.parts.filter(p=>need[p.id]).map(p=>`${Math.max(0,need[p.id]-(+st.owned[p.id]||0))} × ${pn(p)}`);if(AN.supports)lines.push(`${Math.max(0,AN.supports-(+st.owned.support||0))} × ${partName("support")}`);lines.push(`${Math.max(0,AN.clips-(+st.owned.clip||0))} × Tamiya Track Clip`);copy(`${st.name||L("Circuito","Track")} — ${L("da stampare","to print")}\n`+lines.join("\n"));}
  else if(a==="copy-json")copy(JSON.stringify(st));
  else if(a==="copy-svg")copy(exportSVG());
  else if(a==="clear")commit(()=>{st.layout=[];sel=null;});
  else if(a==="reset"){hist.push(JSON.stringify(st));st=defaults();sel=null;save();render();fit();toast(L("Ripristinato. Puoi annullare.","Reset done. You can undo."));}
  else if(a==="import"){try{const s=JSON.parse($("#imp").value);if(!Array.isArray(s.layout)||!Array.isArray(s.types)||!Array.isArray(s.parts))throw 0;commit(()=>{st=migrate(Object.assign(defaults(),s));sel=null;});fit();toast(L("Circuito caricato","Track loaded"));}catch(_){toast(L("JSON non valido: incolla il testo copiato con «Copia JSON».","Invalid JSON: paste the text copied with «Copy JSON»."));}}
  else if(a==="add-type"){
    const kind=$("#n-kind").value,name=$("#n-name").value.trim(),v=+$("#n-len").value,r=+$("#n-r").value,hh=+$("#n-h").value||0;
    if(!(v>0)||(kind==="curve"&&!(r>st.settings.width/2))){toast(kind==="curve"?L("Indica angolo e un raggio maggiore di metà larghezza pista.","Enter an angle and a radius larger than half the track width."):L("Indica la lunghezza in mm.","Enter the length in mm."));return;}
    const uid=Date.now().toString(36),pid="x"+uid,tid="T"+uid;
    const nm=name||(kind==="curve"?`${L("Curva","Curve")} ${v}° R${r}`:`${L("Rettilineo","Straight")} ${v}`);
    commit(()=>{st.parts.push({id:pid,name:nm,kit:0,h:hh});
      st.types.push(kind==="curve"?{id:tid,label:`${v}°`,name:nm,kind,ang:v,r,parts:{[pid]:1},segs:1,custom:true}:{id:tid,label:String(v),name:nm,kind,len:v,parts:{[pid]:1},segs:1,custom:true});});
    toast(L(`Aggiunto «${nm}» alla barra dei pezzi`,`Added «${nm}» to the piece bar`));
  }
});

async function copy(txt){
  try{await navigator.clipboard.writeText(txt);toast(L("Copiato negli appunti","Copied to the clipboard"));}
  catch(_){tab="file";renderPane();const t=$("#imp");t.value=txt;t.focus();t.select();toast(L("Copia non consentita: testo selezionato nel riquadro, copialo a mano.","Copying isn't allowed: the text is selected in the box, copy it by hand."));}
}
function exportSVG(){
  const bb=bbox(G)||{x0:-500,y0:-300,w:1000,h:600},m=80,cs=getComputedStyle(document.documentElement);
  const body=svg.innerHTML.replace(/<rect[^>]*url\(#gp\)[^>]*\/>/,"").replace(/<g class="ovl">[\s\S]*?<\/g>/,"").replace(/<path class="sketch[^>]*>/g,"");
  const css=["--track","--wall","--lane1","--lane2","--muted","--ink","--accent","--bad","--grid"].reduce((s,k)=>s.split(`var(${k})`).join(cs.getPropertyValue(k).trim()),
    `.body{fill:var(--track);stroke:var(--wall);stroke-width:6}.l1{fill:var(--lane1);fill-opacity:.2}.l2{fill:var(--lane2);fill-opacity:.2}.div{stroke:var(--wall);stroke-width:4;fill:none}.joint{stroke:var(--wall);stroke-width:3;stroke-dasharray:8 6}.lbl{font:600 40px sans-serif;fill:var(--muted);text-anchor:middle;dominant-baseline:central}.x1{stroke:var(--lane1);stroke-width:12;fill:none}.x2{stroke:var(--lane2);stroke-width:12;fill:none}.bridge{fill:var(--wall);fill-opacity:.18;stroke:var(--wall);stroke-width:3}.feat{fill:var(--accent);fill-opacity:.35}.start{stroke:var(--ink);stroke-width:14;stroke-dasharray:14 14}.gap{stroke:var(--bad);stroke-width:5;stroke-dasharray:16 12}.cursor{display:none}`);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${((bb.w+2*m)/10).toFixed(0)}mm" height="${((bb.h+2*m)/10).toFixed(0)}mm" viewBox="${bb.x0-m} ${bb.y0-m} ${bb.w+2*m} ${bb.h+2*m}"><style>${css}</style>${body}</svg>`;
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2800);}

/* ---------- pan, zoom, touch (2D) ---------- */
const ptrs=new Map();let gest=null;
let live=null;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){gest={moved:false,target:e.target,sx:e.clientX,sy:e.clientY};
    if(drawMode){gest.draw=[worldOf(e.clientX,e.clientY)];live=document.createElementNS("http://www.w3.org/2000/svg","path");live.setAttribute("class","sketch");svg.appendChild(live);}}
  else if(gest){gest.moved=true;if(gest.draw){gest.draw=null;if(live){live.remove();live=null;}}}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=[...ptrs.values()].map(p=>({...p}));ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const cur=[...ptrs.values()];
  if(cur.length===1&&gest&&gest.draw){
    const q=worldOf(e.clientX,e.clientY),l=gest.draw[gest.draw.length-1];
    if(Math.hypot(q.x-l.x,q.y-l.y)>6/view.z){gest.draw.push(q);if(live)live.setAttribute("d","M"+gest.draw.map(f).join("L"));}
    return;
  }
  if(cur.length===1){
    const p0=prev[0],c=cur[0];
    if(gest&&!gest.moved&&Math.hypot(c.x-gest.sx,c.y-gest.sy)>6)gest.moved=true;
    if(gest&&gest.moved){view.cx-=(c.x-p0.x)/view.z;view.cy-=(c.y-p0.y)/view.z;setViewBox();}
  }else if(cur.length===2){
    const r=svg.getBoundingClientRect(),d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y),d1=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y);
    const m0={x:(prev[0].x+prev[1].x)/2-r.left,y:(prev[0].y+prev[1].y)/2-r.top},m1={x:(cur[0].x+cur[1].x)/2-r.left,y:(cur[0].y+cur[1].y)/2-r.top};
    view.cx-=(m1.x-m0.x)/view.z;view.cy-=(m1.y-m0.y)/view.z;if(d0>0)zoomAt(d1/d0,m1.x,m1.y);else setViewBox();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gest&&gest.draw){
    const pts=gest.draw;gest=null;if(live){live.remove();live=null;}
    if(e.type==="pointerup"&&pts.length>5){IMG=null;OV={img:OV.img,path:null};if(runFit(pts,"draw"))setDraw(false);}
    return;
  }
  if(ptrs.size===0&&gest){
    if(!gest.moved&&e.type==="pointerup"){const g=gest.target.closest&&gest.target.closest("[data-i]");const i=g?+g.dataset.i:null;sel=(i==null||i===sel)?null:i;render();}
    gest=null;
  }
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();(e.shiftKey?$("#redo"):$("#undo")).click();}
  else if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();$("#del").click();}
  else if(e.key==="Escape"){if(drawMode)setDraw(false);sel=null;render();}
});
new ResizeObserver(()=>setViewBox()).observe(svg);

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-en]").forEach(el=>{if(el.dataset.it==null)el.dataset.it=el.textContent;el.textContent=LANG==="en"?el.dataset.en:el.dataset.it;});
  for(const a of ["aria","title"])document.querySelectorAll(`[data-en-${a}]`).forEach(el=>{const at=a==="aria"?"aria-label":"title",k="it"+a;if(el.dataset[k]==null)el.dataset[k]=el.getAttribute(at)||"";el.setAttribute(at,LANG==="en"?el.dataset[a==="aria"?"enAria":"enTitle"]:el.dataset[k]);});
  $("#src").innerHTML=L('Pista a 2 corsie compatibile Tamiya · pezzi da <a href="https://makerworld.com/en/models/542904-2-lane-mini-4wd-track">MINI4WD 2 LANE DIY TRACK</a> e modelli collegati','Tamiya-compatible 2-lane track · pieces from <a href="https://makerworld.com/en/models/542904-2-lane-mini-4wd-track">MINI4WD 2 LANE DIY TRACK</a> and related models');
  $("#ver").title=L("Versione","Version");
  $("#kofi").title=L("Offrimi un caffè su Ko-fi","Buy me a coffee on Ko-fi");
  const b=$("#lang");b.textContent=LANG==="en"?"IT":"EN";b.title=LANG==="en"?"Passa all'italiano":"Switch to English";
  if(window.M4Engine)M4Engine.lang=LANG;
}
$("#lang").onclick=()=>{
  LANG=LANG==="en"?"it":"en";try{localStorage.setItem("m4wd-lang",LANG);}catch(e){}
  applyLang();render();if(is3d)build3D(true);if(wsOn)wsSchedule();else wsRes=null;
};
document.getElementById("ver").textContent="v"+APP_VERSION;
applyLang();render();fit();
</script>
