<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini4WD Track Planner</title>
<meta name="apple-mobile-web-app-title" content="Track Planner">
<meta name="application-name" content="Track Planner">
<meta name="theme-color" content="#0b4ea2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"%3E %3Crect width="512" height="512" fill="%23ffffff"/%3E %3Cpath d="M0 0H512V150L0 22Z" fill="%230b4ea2"/%3E %3Cpath d="M0 22L512 150V176L0 48Z" fill="%23e1251b"/%3E %3Cg fill="none" transform="translate%280 30%29"%3E %3Cpath d="M126 512V300A130 130 0 0 1 386 300V512" stroke="%2314213a" stroke-width="152"/%3E %3Cpath d="M91 512V300A165 165 0 0 1 421 300V512" stroke="%23e1251b" stroke-width="58"/%3E %3Cpath d="M161 512V300A95 95 0 0 1 351 300V512" stroke="%230b4ea2" stroke-width="58"/%3E %3Cpath d="M126 512V300A130 130 0 0 1 386 300V512" stroke="%23ffffff" stroke-width="6" stroke-dasharray="22 16"/%3E %3C/g%3E %3Cg transform="translate%2852 400%29"%3E %3Crect width="148" height="36" fill="%2314213a"/%3E %3Cg fill="%23ffffff"%3E %3Crect x="0" y="0" width="18" height="18"/%3E%3Crect x="36" y="0" width="18" height="18"/%3E%3Crect x="72" y="0" width="18" height="18"/%3E%3Crect x="108" y="0" width="18" height="18"/%3E %3Crect x="18" y="18" width="18" height="18"/%3E%3Crect x="54" y="18" width="18" height="18"/%3E%3Crect x="90" y="18" width="18" height="18"/%3E%3Crect x="126" y="18" width="18" height="18"/%3E %3C/g%3E %3C/g%3E %3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="mini4wd-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="mini4wd-icon-180.png">
<link rel="manifest" href="mini4wd.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: tavolo di montaggio a sinistra, scheda tecnica a destra; su telefono impilati */
  --bg:#e8ecf0; --surface:#ffffff; --ink:#15202c; --muted:#5a6675; --line:#d3dae2; --accent:#f2b705;
  --lane1:#d7372f; --lane2:#2a6fdb; --track:#fbfcfd; --wall:#6f7b89; --grid:#d9e0e8;
  --ok:#17834a; --warn:#b86e00; --bad:#c42e2e;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#98a4b2; --line:#2b3540; --accent:#f5c22e;
    --lane1:#ef5b50; --lane2:#5a93f0; --track:#242c36; --wall:#a6b1be; --grid:#1c242d;
    --ok:#40c077; --warn:#e3a12c; --bad:#f06767; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#98a4b2; --line:#2b3540; --accent:#f5c22e;
  --lane1:#ef5b50; --lane2:#5a93f0; --track:#242c36; --wall:#a6b1be; --grid:#1c242d;
  --ok:#40c077; --warn:#e3a12c; --bad:#f06767; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-anchor:none}
.pane{overflow-anchor:none}
.pane>*{flex-shrink:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:1fr;gap:0;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 16px 8px}
h1{font:700 26px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--muted);font-weight:600}
.src{color:var(--muted);font-size:12.5px;margin:0}
.ver{font:500 12px/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 6px;align-self:center}
.stage{position:relative;height:58svh;min-height:300px;margin:0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#cv:active{cursor:grabbing}
#v3{position:absolute;inset:0;display:none;touch-action:none}
#v3 canvas{display:block;width:100%;height:100%}
.stage.is3d #cv{display:none}
.stage.is3d #v3{display:block}
.stage.is3d .only2d{display:none}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 120px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 12.5px/1.2 var(--mono);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--ok)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}
.mode{position:absolute;right:10px;top:10px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font:700 15px/1 var(--display);letter-spacing:.06em;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.vbtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.vbtns button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 17px/1 var(--mono)}
.tip3d{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:none}
.stage.is3d .tip3d{display:block}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;align-items:stretch}
.sep{flex:0 0 auto;display:flex;align-items:center;padding:0 2px 0 8px;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);border-right:2px solid var(--line)}
.pb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:58px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pb svg{width:30px;height:22px}
.pb b{font:700 15px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pb small{font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.pb.x{border-style:dashed}
.pb:hover{border-color:var(--ink)}
.pb:active{transform:translateY(1px)}
.ab{flex:0 0 auto;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;white-space:nowrap}
.ab:hover:not(:disabled){background:var(--surface)}
.ab:disabled{opacity:.4;cursor:default}
.ab.danger{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{margin:0 16px 24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;padding:11px 5px;border:0;background:transparent;cursor:pointer;font:700 14px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font:700 17px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font:500 18px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.status{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:5px}
.status.ok{border-left-color:var(--ok)} .status.warn{border-left-color:var(--warn)} .status.bad{border-left-color:var(--bad)}
.status b{display:block}
.status p{margin:2px 0 0;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{padding:6px 10px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer;font:500 12.5px var(--mono)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--mono)}
tfoot td{font-weight:600;border-bottom:0}
.tw{overflow-x:auto}
.chip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;font:500 10.5px/1.5 var(--mono);background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);vertical-align:1px;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=number]{width:78px;font-family:var(--mono);text-align:right}
textarea{width:100%;min-height:110px;font:12px/1.4 var(--mono)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:65ch}
.models{display:flex;flex-direction:column;gap:10px}
.model{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.model b{font-weight:600}
.model small{color:var(--muted)}
.model p{margin:0;grid-column:1/-1;font-size:13px}
.model a.btn{height:32px;font-size:13px}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font:600 15px/1 var(--mono)}
.qty input{width:60px}
.log{list-style:none;margin:0;padding:0 8px 0 0;display:flex;flex-direction:column;max-height:calc(5 * 2.6rem);overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.log li{min-height:2.6rem;box-sizing:border-box}
.log li:last-child{border-bottom:0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.log time{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.log .pos{color:var(--ok);font-family:var(--mono)} .log .neg{color:var(--bad);font-family:var(--mono)}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feats label{position:relative;display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--bg)}
.feats input{position:absolute;opacity:0;pointer-events:none}
.feats label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.feats label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card svg{width:100%;height:110px;background:var(--bg);border-radius:6px}
.card h3{margin:0;font:700 17px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.card .meta{font:12.5px/1.4 var(--mono);color:var(--muted)}
.card .bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--warn) 35%,transparent);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--ok)}
.card ul{margin:0;padding-left:18px;font-size:12.5px}
.card .btn{margin-top:auto;justify-content:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
/* SVG */
.gridl{stroke:var(--grid);stroke-width:2;fill:none}
.body{fill:var(--track);stroke:var(--wall);stroke-width:6;stroke-linejoin:round}
.elev .body{stroke-dasharray:24 10}
.l1{fill:var(--lane1);fill-opacity:.2}
.l2{fill:var(--lane2);fill-opacity:.2}
.div{stroke:var(--wall);stroke-width:4;fill:none}
.joint{stroke:var(--wall);stroke-width:3;stroke-dasharray:8 6}
.lbl{font:600 40px var(--display);fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.04em}
.x1{stroke:var(--lane1);stroke-width:12;fill:none;stroke-linecap:round}
.x2{stroke:var(--lane2);stroke-width:12;fill:none;stroke-linecap:round}
.bridge{fill:var(--wall);fill-opacity:.18;stroke:var(--wall);stroke-width:3;stroke-dasharray:10 6}
.feat{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:3}
.sel .body{stroke:var(--accent);stroke-width:14;stroke-dasharray:none}
.cursor{fill:var(--accent);stroke:var(--ink);stroke-width:4}
.start{stroke:var(--ink);stroke-width:14;stroke-dasharray:14 14}
.gap{stroke:var(--bad);stroke-width:5;stroke-dasharray:16 12;fill:none}
.empty{font:600 46px var(--display);fill:var(--muted);text-anchor:middle}
@media (min-width:980px){
  .app{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto 1fr auto;height:100%}
  header{grid-column:1/3}
  .stage{grid-column:1;grid-row:2;height:auto;min-height:0;margin-right:8px}
  .tools{grid-column:1;grid-row:3;position:static;padding-bottom:16px}
  .panel{grid-column:2;grid-row:2/4;margin:0 16px 16px 8px;display:flex;flex-direction:column;min-height:0}
  .pane{overflow:auto;flex:1}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mini4WD <span>Track Planner</span></h1>
    <span class="ver" id="ver" title="Versione"></span>
    <p class="src">Pista a 2 corsie compatibile Tamiya · pezzi da <a href="https://makerworld.com/en/models/542904-2-lane-mini-4wd-track">MINI4WD 2 LANE DIY TRACK</a> e modelli collegati</p>
  </header>

  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="Pianta del circuito"></svg>
    <div id="v3" aria-label="Vista 3D del circuito"></div>
    <div class="hud" id="hud"></div>
    <div class="mode" role="group" aria-label="Vista">
      <button id="m2d" aria-pressed="true">2D</button>
      <button id="m3d" aria-pressed="false">3D</button>
    </div>
    <div class="vbtns">
      <button id="zin" class="only2d" title="Ingrandisci" aria-label="Ingrandisci">+</button>
      <button id="zout" class="only2d" title="Riduci" aria-label="Riduci">−</button>
      <button id="zfit" title="Adatta vista" aria-label="Adatta vista">⤢</button>
    </div>
    <div class="tip3d">Trascina per ruotare · due dita o rotella per zoom</div>
  </div>

  <div class="tools">
    <div class="row" id="pieces" aria-label="Aggiungi pezzo"></div>
    <div class="row">
      <button class="ab" id="undo">↶ Annulla</button>
      <button class="ab" id="redo">↷ Ripeti</button>
      <button class="ab" id="flip">⇄ Inverti curva</button>
      <button class="ab" id="flipv">⇅ Salita/discesa</button>
      <button class="ab" id="rot">⟳ Ruota 45°</button>
      <button class="ab" id="desel">Fine pista</button>
      <button class="ab danger" id="del">✕ Elimina</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="sum">Riepilogo</button>
      <button role="tab" data-tab="bom">Pezzi</button>
      <button role="tab" data-tab="inv">Magazzino</button>
      <button role="tab" data-tab="gen">Idee</button>
      <button role="tab" data-tab="mod">Modelli</button>
      <button role="tab" data-tab="cat">Catalogo</button>
      <button role="tab" data-tab="file">Circuiti</button>
    </div>
    <div class="pane" id="pane"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const APP_VERSION="1.0.4";
const $=s=>document.querySelector(s);
const DEG=Math.PI/180, KEY="m4wd-planner-v1";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(v,d=0)=>Number(v).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const MW="https://makerworld.com/en/models/";
const MWS=q=>"https://makerworld.com/en/search/models?keyword="+encodeURIComponent(q);

/* ---------- modelli MakerWorld collegati ---------- */
const MODELS=[
  {id:"base",name:"2 LANE MINI 4WD TRACK",by:"Pat",url:MW+"542904-2-lane-mini-4wd-track",what:"Il kit base: rettilinei 200/215/100, 8 curve da 45°, cambio corsia con rampe flyover.",types:["S200","S215","S100","C45","LC"],known:true},
  {id:"jump",name:"2 LANE MINI 4WD TRACK Jump",by:"Jangyy",url:MW+"1373681-2-lane-mini-4wd-track-jump",what:"Rettilineo da 200 mm con trampolino. Circa 7 h di stampa.",types:["J200"],known:true},
  {id:"spiral",name:"Spiral Track element for 2 LANE MINI 4WD TRACK",by:"Jangyy",url:MW+"1395843-spiral-track-element-for-2-lane-mini-4wd-track",what:"Spirale che sale di livello girando su se stessa.",types:["SPI"]},
  {id:"wall",name:"Wall Track element for 2 LANE MINI 4WD TRACK",by:"Jangyy",url:MW+"1418601-wall-track-element-for-2-lane-mini-4wd-track",what:"Tratto con parete alta.",types:["WALL"]},
  {id:"hill",name:"2 LANE MINI 4WD TRACK Ramp/Hill",by:"Jangyy",url:MWS("2 LANE MINI 4WD TRACK Ramp/Hill"),what:"Dosso: salita e discesa sullo stesso tratto.",types:["HILL"]},
  {id:"rainbow",name:"Tamiya rainbow track 2 lane (no change lane)",by:"Sunza83",url:MW+"1336265-tamiya-rainbow-track-2-lane-no-change-lane",what:"2 rampe e supporti per sollevare una curva a 180° (rainbow) usando le curve normali.",types:["RUP"]},
  {id:"saddle",name:"Mini 4WD Track Saddle",by:"user_2201040605",url:MW+"734281-mini-4wd-track-saddle",what:"Sella da appoggiare nel rettilineo: l'auto ci salta sopra. 4,6 h di stampa.",types:["SAD"],known:true},

/* ---------- geometria ---------- */

const normDeg=d=>{d=((d%360)+540)%360-180;return Math.abs(d+180)<1e-6?180:d;};

function suggestions(g,an){

  if(an.planClosed)return{msg:"In pianta il circuito si chiude."+zmsg,opts:[]};
  if(Math.abs(an.dh)>=0.5){
    const t45=st.types.find(t=>t.id==="C45")||st.types.find(t=>t.kind==="curve");
    const k=t45?Math.round(Math.abs(an.dh)/t45.ang):0;
    return{msg:`La direzione finale è sfasata di ${nf(Math.abs(an.dh))}°: servono altre curve ${an.dh>0?"a destra":"a sinistra"}${k?` (circa ${k} da ${t45.ang}°)`:""}.`+zmsg,opts:[]};

  if(along<0) return{msg:`La fine supera la partenza di ${nf(-along)} mm: togli rettilinei.`+zmsg,opts:[]};
  const str=st.types.filter(t=>t.kind==="straight"&&!t.prof&&!t.dz&&(!t.x||st.settings.extras)).sort((a,b)=>b.len-a.len), res=[], lim=Math.max(st.settings.tol,12);

    if(Math.abs(sum-along)<=lim&&pick.length)res.push({pick:[...pick],err:sum-along});
    if(pick.length>=8||sum>along+lim||i>=str.length)return;
    pick.push(str[i]);dfs(i,sum+str[i].len,pick);pick.pop();dfs(i+1,sum,pick);
  })(0,0,[]);

  if(t.kind==="curve"){const p=d==="L"?"M24 20 V14 A10 10 0 0 0 14 4 H4":"M6 20 V14 A10 10 0 0 1 16 4 H26";return `<svg viewBox="0 0 30 22"><path d="${p}" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;}
  if(t.kind==="lane")return `<svg viewBox="0 0 30 22"><path d="M2 6 H8 L22 16 H28 M2 16 H8 L22 6 H28" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  if(t.dz)return `<svg viewBox="0 0 30 22"><path d="${v<0?"M3 6 H9 L21 17 H27":"M3 17 H9 L21 6 H27"}" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;
  if(t.prof==="jump")return `<svg viewBox="0 0 30 22"><path d="M2 18 H8 L20 9 V18 H28" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  if(t.prof==="hill")return `<svg viewBox="0 0 30 22"><path d="M2 18 C10 18 10 5 15 5 C20 5 20 18 28 18" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  if(t.prof==="saddle")return `<svg viewBox="0 0 30 22"><path d="M2 18 H10 L15 12 L20 18 H28" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;

      if(!ok(X1,X2,E1,E2,FF,B1,B2,BOT))return null;
      return[...X1,...Rn(2),...E1,...Rn(2,"L"),...FF,...Rn(2,"L"),...E2,...Rn(2),...X2,...Rn(2),...B1,...Rn(2),...BOT,...Rn(2),...B2,...Rn(2)];}},
    {id:"elle",name:"Pista a L",elev:false,w:F.tech?2:F.speed?.3:1,build:(st0,tp,bt)=>{
      const sc=rlen(0,maxD/2),sWc=rlen(0,maxD/2),h1=rlen(0,maxD/2),h2=rlen(0,maxD/2);if([sc,sWc,h1,h2].some(v=>v==null))return null;
      const TOP=side(sc+sWc+R2c,st0,tp),LEFT=side(h1+h2+R2c,st0,bt),H1=side(h1,st0),SC=side(sc,st0),H2=side(h2,st0),SW=side(sWc,st0);
      if(!ok(TOP,LEFT,H1,SC,H2,SW))return null;
      return[...TOP,...Rn(2),...H1,...Rn(2),...SC,...Rn(2,"L"),...H2,...Rn(2),...SW,...Rn(2),...LEFT,...Rn(2)];}}
  ];
  const need3d=F.rainbow||F.spiral;
  const tpls=TPL.filter(t=>t.elev||!need3d);
  const wsum=tpls.reduce((a,t)=>a+t.w,0);
  const pickT=()=>{let r=Math.random()*wsum;for(const t of tpls){r-=t.w;if(r<=0)return t;}return tpls[0];};
  const missing=[];
  if(F.lc&&!has("LC"))missing.push("cambio corsia");
  const all=[];let tries=0;
  while(tries<2500&&all.length<80){
    tries++;
    const tpl=pickT(),tp=[],bt=[];
    if(F.lc&&has("LC"))bt.push({t:"LC",pos:"mid"});
    const extras=[];if(F.jump&&has("J200"))extras.push("J200");
    if(F.park)for(const id of["J200","SAD","HILL",Math.random()<.5?"J200":"SAD"])if(has(id))extras.push(id);
    for(const id of extras)(Math.random()<.5?tp:bt).push({t:id,pos:"any"});
    if(F.rainbow&&has("RUP")){tp.push({t:"RUP",v:1,pos:"end"});bt.unshift({t:"RUP",v:-1,pos:"start"});}
    if(F.spiral&&has("SPI")){tp.push({t:"SPI",v:1,d:"L",pos:"mid"});bt.push({t:"SPI",v:-1,d:"L",pos:"mid"});}
    const stock={...owned};
    const layout=tpl.build(stock,tp,bt);if(!layout)continue;
    const g=geom(layout),an=analyse(g);if(!an.closed||an.below)continue;
    const bb=bbox(g);if(useRoom&&!((bb.w<=RW&&bb.h<=RH)||(bb.w<=RH&&bb.h<=RW)))continue;
    const need={};for(const it of layout)for(const[p,q]of Object.entries(T[it.t].parts))need[p]=(need[p]||0)+q;
    if(an.supports)need.support=(need.support||0)+an.supports;
    const miss={};let prints=0,pieces=0;for(const[p,n]of Object.entries(need)){pieces+=n;const m=Math.max(0,n-(owned[p]||0));if(m){miss[p]=m;prints+=m;}}
    if(stockOnly&&prints)continue;
    const key=layout.map(x=>x.t+(x.d||"")+(x.v||"")).join(",");if(all.some(c=>c.key===key))continue;
    const curves=layout.filter(x=>T[x.t].kind==="curve").length,strLen=g.els.filter(e=>e.t.kind!=="curve").reduce((a,e)=>a+e.L,0);
    let sc=Math.random()*1.2+an.center/6000;
    if(F.speed)sc+=strLen/an.center*4+(tpl.id==="ovale"||tpl.id==="rett"?1:0)-curves/20;
    if(F.tech)sc+=curves/10+(["chicane","fagiolo","elle"].includes(tpl.id)?1.5:0);
    if(F.compact)sc+=2-(bb.w*bb.h)/3e6;
    if(!stockOnly)sc-=prints*.06;
    const hours=Object.entries(miss).reduce((h,[p,m])=>h+m*((st.parts.find(x=>x.id===p)||{}).h||0),0);
    const cnt=id=>layout.filter(x=>x.t===id).length,tags=[];
    if(cnt("LC"))tags.push("scambio");if(cnt("J200"))tags.push(cnt("J200")>1?`${cnt("J200")} salti`:"salto");if(cnt("SAD"))tags.push("sella");if(cnt("HILL"))tags.push("dosso");
    if(cnt("RUP"))tags.push("sopraelevata");if(cnt("SPI"))tags.push("spirale");
    const adj=F.speed&&!F.tech?" veloce":F.tech&&!F.speed?" tecnico":F.park?" jump":"";
    all.push({key,layout,tpl,score:sc,title:tpl.name+adj,tag:tags.join(" · ")||"base",lap:an.center,w:bb.w,h:bb.h,pieces,prints,miss,clipMiss:Math.max(0,an.clips-(owned.clip||0)),hours,lc:an.lc});
  }
  if(!all.length){
    let why=stockOnly?"Con i pezzi in magazzino non riesco a chiudere un circuito con queste opzioni.":"Nessun circuito con queste opzioni entra nello spazio indicato.";
    if(stockOnly&&(F.jump||F.park))why+=" Per i salti servono i pezzi Jump/Sella/Dosso in magazzino.";
    if(stockOnly&&(F.rainbow||F.spiral))why+=" Per sopraelevata e spirale servono rampe, spirali e supporti in magazzino.";
    if(F.spiral&&useRoom)why+=" La spirale sporge di circa 120 cm dal circuito: serve più spazio.";
    return{err:why+" Prova a togliere qualche opzione."};
  }
  all.sort((a,b)=>b.score-a.score);
  const out=[],used=new Set();
  for(const c of all){if(out.length>=3)break;if(!used.has(c.tpl.id)){used.add(c.tpl.id);out.push(c);}}
  for(const c of all){if(out.length>=3)break;if(!out.includes(c))out.push(c);}
  return{res:out};
}
function cardHTML(c,key){
  const have=c.pieces-c.prints,pct=c.pieces?Math.round(have/c.pieces*100):0;
  const list=Object.entries(c.miss).map(([p,m])=>`<li>${m} × ${esc(partName(p))}</li>`).join("")+(c.clipMiss?`<li>${c.clipMiss} × clip</li>`:"");
  return `<div class="card">${miniSVG(c.layout)}<h3>${esc(c.title)}</h3><span class="chip ${c.prints?"":"ok"}" style="margin:0;align-self:flex-start">${esc(c.tag)}</span>
    <div class="meta">${nf(c.w/10)}×${nf(c.h/10)} cm · giro ${nf(c.lap/1000,2)} m · ${c.pieces} pezzi${c.lc?"":" · senza scambio"}</div>
    <div class="bar" title="${pct}% già in magazzino"><i style="width:${pct}%"></i></div>
    <div class="meta">Hai ${have} · da stampare ${c.prints}${c.prints?` (~${nf(c.hours,1)} h)`:""}</div>
    ${list?`<ul>${list}</ul>`:`<p class="note" style="color:var(--ok)">Hai già tutto.</p>`}
    <button class="btn" data-use="${key}">Usa questo tracciato</button></div>`;
}
function paneGen(){
  const s=st.settings,RS=s.rnd;
  let h=`<div class="form"><label for="g-w">Larghezza spazio (cm)<input type="number" id="g-w" data-set="roomW" min="0" value="${s.roomW||""}" placeholder="es. 300"></label>
  <label for="g-h">Profondità spazio (cm)<input type="number" id="g-h" data-set="roomH" min="0" value="${s.roomH||""}" placeholder="es. 150"></label></div>
  <div><h2>Circuito casuale</h2><div class="form" style="margin-top:8px"><label for="r-src">Parti da
    <select id="r-src" data-rsrc="1"><option value="room" ${RS.src==="room"?"selected":""}>Spazio disponibile (posso stampare)</option><option value="stock" ${RS.src==="stock"?"selected":""}>Solo pezzi in magazzino</option><option value="both" ${RS.src==="both"?"selected":""}>Pezzi in magazzino + spazio</option></select></label></div>
  <div class="feats" style="margin-top:10px" role="group" aria-label="Cosa vuoi nel circuito">${FEATS.map(f=>`<label for="rf-${f.id}"><input type="checkbox" id="rf-${f.id}" data-rf="${f.id}" ${RS.feat[f.id]?"checked":""}>${f.label}</label>`).join("")}</div>
  <div class="btns" style="margin-top:10px"><button class="btn primary" data-act="rnd">🎲 Genera 3 circuiti</button></div>
  <p class="note" style="margin-top:6px">Ogni clic dà circuiti diversi. Pista jump = salti, sella e dosso; Sopraelevata = curva rialzata con rampe rainbow.</p>`;
  if(rndErr)h+=`<p class="note" style="color:var(--bad);margin-top:6px">${esc(rndErr)}</p>`;
  if(rndRes&&rndRes.length)h+=`<div class="cards" style="margin-top:10px">`+rndRes.map((c,k)=>cardHTML(c,"r"+k)).join("")+`</div>`;
  h+=`</div><div><h2>Alternative ordinate</h2><p class="note" style="margin:6px 0">Ovali, rettangoli e ottagoni che entrano nello spazio, dal più economico al più lungo.</p>
  <label class="check" for="g-lc"><input type="checkbox" id="g-lc" data-set="genLC" ${s.genLC?"checked":""}> Includi il cambio corsia</label>
  <label class="check" for="g-x"><input type="checkbox" id="g-x" data-set="genX" ${s.genX?"checked":""}> Usa anche i rettilinei extra (modulare 240)</label>
  <div class="btns" style="margin-top:8px"><button class="btn" data-act="gen">Genera alternative</button></div>`;
  if(genRes&&!genRes.length)h+=`<p class="note">Nessun tracciato entra in ${s.roomW}×${s.roomH} cm. Serve almeno circa ${nf((2*(st.types.find(t=>t.id==="C45").r+s.width/2))/10)} cm di profondità per una curva a 180°.</p>`;
  if(genRes&&genRes.length)h+=`<div class="cards" style="margin-top:10px">`+genRes.map((c,k)=>cardHTML(c,"g"+k)).join("")+`</div>`;
  if(!Object.values(st.owned).some(v=>+v>0))h+=`<p class="note" style="color:var(--warn)">Il magazzino è vuoto: tutti i pezzi risultano da stampare. Compilalo nella scheda «Magazzino».</p>`;
  return h+`</div>`;
}

/* ---------- azioni ---------- */
function addPiece(id,d,v){
  commit(()=>{
    const it={t:id};if(d)it.d=d;if(v)it.v=+v;
    if(sel!=null){st.layout.splice(sel+1,0,it);sel=sel+1;}else st.layout.push(it);
  });
}
$("#pieces").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(b)addPiece(b.dataset.add,b.dataset.d,b.dataset.v);});
$("#undo").onclick=()=>{if(!hist.length)return;fut.push(JSON.stringify(st));st=JSON.parse(hist.pop());sel=null;save();render();};
$("#redo").onclick=()=>{if(!fut.length)return;hist.push(JSON.stringify(st));st=JSON.parse(fut.pop());sel=null;save();render();};
$("#flip").onclick=()=>{if(sel==null)return;commit(()=>{const it=st.layout[sel];it.d=it.d==="L"?"R":"L";});};
$("#flipv").onclick=()=>{if(sel==null)return;commit(()=>{const it=st.layout[sel];it.v=(it.v||1)>0?-1:1;});};
$("#rot").onclick=()=>commit(()=>{st.settings.startH=((st.settings.startH||0)+45)%360;});
$("#desel").onclick=()=>{sel=null;render();};
$("#del").onclick=()=>{if(!st.layout.length)return;commit(()=>{if(sel!=null){st.layout.splice(sel,1);sel=sel>0?sel-1:null;}else st.layout.pop();});};
$("#zin").onclick=()=>zoomAt(1.3);$("#zout").onclick=()=>zoomAt(1/1.3);$("#zfit").onclick=fit;
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;renderPane();}});

const pane=$("#pane");
pane.addEventListener("change",e=>{
  const el=e.target,v=el.value;
  if(el.dataset.rf){commit(()=>{st.settings.rnd.feat[el.dataset.rf]=el.checked;});}
  else if(el.dataset.rsrc){commit(()=>{st.settings.rnd.src=v;});}
  else if(el.type==="checkbox"&&el.dataset.set){commit(()=>{st.settings[el.dataset.set]=el.checked;genRes=null;});}
  else if(el.dataset.set){commit(()=>{st.settings[el.dataset.set]=v===""?0:+v;if(/^room/.test(el.dataset.set))genRes=null;});}
  else if(el.dataset.own){commit(()=>{setOwned(el.dataset.own,v,"Modifica manuale");});}
  else if(el.dataset.type){const t=st.types.find(x=>x.id===el.dataset.type);if(t&&+v>0)commit(()=>{t[el.dataset.k]=+v;});else render();}
  else if(el.dataset.part){const p=st.parts.find(x=>x.id===el.dataset.part);if(p)commit(()=>{p[el.dataset.k]=Math.max(0,+v||0);});}
  else if(el.id==="c-name"){commit(()=>{st.name=v;});}
});
pane.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.sugg!=null){const o=window._sugg[+b.dataset.sugg];if(o)commit(()=>{sel=null;for(const t of o.pick)st.layout.push({t:t.id});});return;}
  if(b.dataset.preset){const p=PRESETS[b.dataset.preset];commit(()=>{st.layout=p.items();st.name=p.name;sel=null;});fit();if(is3d)build3D(true);toast(`Caricato «${p.name}»`);return;}
  if(b.dataset.deltype){const id=b.dataset.deltype;commit(()=>{const t=st.types.find(x=>x.id===id);st.types=st.types.filter(x=>x.id!==id);st.layout=st.layout.filter(x=>x.t!==id);if(t)for(const k of Object.keys(t.parts))if(k.startsWith("x"))st.parts=st.parts.filter(p=>p.id!==k);sel=null;});return;}
  const a=b.dataset.act;
  if(b.dataset.inc){const id=b.dataset.inc;commit(()=>setOwned(id,(+st.owned[id]||0)+(+b.dataset.q),"Modifica manuale"));return;}
  if(b.dataset.use!=null){const u=b.dataset.use,c=u[0]==="r"?rndRes&&rndRes[+u.slice(1)]:genRes&&genRes[+u.slice(1)];if(c)commit(()=>{st.layout=c.layout.map(x=>({...x}));st.name=c.title;sel=null;});fit();if(is3d)build3D(true);toast("Tracciato caricato: lo trovi nella pianta");return;}
  if(a==="own-kit")commit(()=>{for(const p of st.parts)if(p.kit)setOwned(p.id,(+st.owned[p.id]||0)+p.kit,"+1 kit base");});
  else if(a==="own-zero")commit(()=>{for(const k of Object.keys(st.owned))setOwned(k,0,"Magazzino azzerato");});
  else if(a==="log-clear")commit(()=>{st.log=[];});
  else if(a==="own-print"){const need=bom();commit(()=>{for(const[k,n]of Object.entries(need))setOwned(k,Math.max(+st.owned[k]||0,n),`Stampati per «${st.name||"circuito"}»`);if(AN.supports)setOwned("support",Math.max(+st.owned.support||0,AN.supports),`Stampati per «${st.name||"circuito"}»`);setOwned("clip",Math.max(+st.owned.clip||0,AN.clips),`Stampati per «${st.name||"circuito"}»`);});toast("Magazzino aggiornato");}
  else if(a==="rnd"){const r=randomGen();rndErr=r.err||"";rndRes=r.res||null;renderPane();}
  else if(a==="gen"){genRes=generate();renderPane();if(!genRes.length)toast("Nessun tracciato entra nello spazio indicato.");}
  else if(a==="copy-bom"){const need=bom();const lines=st.parts.filter(p=>need[p.id]).map(p=>`${Math.max(0,need[p.id]-(+st.owned[p.id]||0))} × ${p.name}`);if(AN.supports)lines.push(`${Math.max(0,AN.supports-(+st.owned.support||0))} × Supporto rialzo`);lines.push(`${Math.max(0,AN.clips-(+st.owned.clip||0))} × Tamiya Track Clip`);copy(`${st.name||"Circuito"} — da stampare\n`+lines.join("\n"));}
  else if(a==="copy-json")copy(JSON.stringify(st));
  else if(a==="copy-svg")copy(exportSVG());
  else if(a==="clear")commit(()=>{st.layout=[];sel=null;});
  else if(a==="reset"){hist.push(JSON.stringify(st));st=defaults();sel=null;save();render();fit();toast("Ripristinato. Puoi annullare.");}
  else if(a==="import"){try{const s=JSON.parse($("#imp").value);if(!Array.isArray(s.layout)||!Array.isArray(s.types)||!Array.isArray(s.parts))throw 0;commit(()=>{st=migrate(Object.assign(defaults(),s));sel=null;});fit();toast("Circuito caricato");}catch(_){toast("JSON non valido: incolla il testo copiato con «Copia JSON».");}}
  else if(a==="add-type"){
    const kind=$("#n-kind").value,name=$("#n-name").value.trim(),v=+$("#n-len").value,r=+$("#n-r").value,hh=+$("#n-h").value||0;
    if(!(v>0)||(kind==="curve"&&!(r>st.settings.width/2))){toast(kind==="curve"?"Indica angolo e un raggio maggiore di metà larghezza pista.":"Indica la lunghezza in mm.");return;}
    const uid=Date.now().toString(36),pid="x"+uid,tid="T"+uid;
    const nm=name||(kind==="curve"?`Curva ${v}° R${r}`:`Rettilineo ${v}`);
    commit(()=>{st.parts.push({id:pid,name:nm,kit:0,h:hh});
      st.types.push(kind==="curve"?{id:tid,label:`${v}°`,name:nm,kind,ang:v,r,parts:{[pid]:1},segs:1,custom:true}:{id:tid,label:String(v),name:nm,kind,len:v,parts:{[pid]:1},segs:1,custom:true});});
    toast(`Aggiunto «${nm}» alla barra dei pezzi`);
  }
});

async function copy(txt){
  try{await navigator.clipboard.writeText(txt);toast("Copiato negli appunti");}
  catch(_){tab="file";renderPane();const t=$("#imp");t.value=txt;t.focus();t.select();toast("Copia non consentita: testo selezionato nel riquadro, copialo a mano.");}
}
function exportSVG(){
  const bb=bbox(G)||{x0:-500,y0:-300,w:1000,h:600},m=80,cs=getComputedStyle(document.documentElement);
  const body=svg.innerHTML.replace(/<rect[^>]*url\(#gp\)[^>]*\/>/,"");
  const css=["--track","--wall","--lane1","--lane2","--muted","--ink","--accent","--bad","--grid"].reduce((s,k)=>s.split(`var(${k})`).join(cs.getPropertyValue(k).trim()),
    `.body{fill:var(--track);stroke:var(--wall);stroke-width:6}.l1{fill:var(--lane1);fill-opacity:.2}.l2{fill:var(--lane2);fill-opacity:.2}.div{stroke:var(--wall);stroke-width:4;fill:none}.joint{stroke:var(--wall);stroke-width:3;stroke-dasharray:8 6}.lbl{font:600 40px sans-serif;fill:var(--muted);text-anchor:middle;dominant-baseline:central}.x1{stroke:var(--lane1);stroke-width:12;fill:none}.x2{stroke:var(--lane2);stroke-width:12;fill:none}.bridge{fill:var(--wall);fill-opacity:.18;stroke:var(--wall);stroke-width:3}.feat{fill:var(--accent);fill-opacity:.35}.start{stroke:var(--ink);stroke-width:14;stroke-dasharray:14 14}.gap{stroke:var(--bad);stroke-width:5;stroke-dasharray:16 12}.cursor{display:none}`);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${((bb.w+2*m)/10).toFixed(0)}mm" height="${((bb.h+2*m)/10).toFixed(0)}mm" viewBox="${bb.x0-m} ${bb.y0-m} ${bb.w+2*m} ${bb.h+2*m}"><style>${css}</style>${body}</svg>`;
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2800);}

/* ---------- pan, zoom, tocco (2D) ---------- */
const ptrs=new Map();let gest=null;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)gest={moved:false,target:e.target,sx:e.clientX,sy:e.clientY};else if(gest)gest.moved=true;
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=[...ptrs.values()].map(p=>({...p}));ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const cur=[...ptrs.values()];
  if(cur.length===1){
    const p0=prev[0],c=cur[0];
    if(gest&&!gest.moved&&Math.hypot(c.x-gest.sx,c.y-gest.sy)>6)gest.moved=true;
    if(gest&&gest.moved){view.cx-=(c.x-p0.x)/view.z;view.cy-=(c.y-p0.y)/view.z;setViewBox();}
  }else if(cur.length===2){
    const r=svg.getBoundingClientRect(),d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y),d1=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y);
    const m0={x:(prev[0].x+prev[1].x)/2-r.left,y:(prev[0].y+prev[1].y)/2-r.top},m1={x:(cur[0].x+cur[1].x)/2-r.left,y:(cur[0].y+cur[1].y)/2-r.top};
    view.cx-=(m1.x-m0.x)/view.z;view.cy-=(m1.y-m0.y)/view.z;if(d0>0)zoomAt(d1/d0,m1.x,m1.y);else setViewBox();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gest){
    if(!gest.moved&&e.type==="pointerup"){const g=gest.target.closest&&gest.target.closest("[data-i]");const i=g?+g.dataset.i:null;sel=(i==null||i===sel)?null:i;render();}
    gest=null;
  }
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();(e.shiftKey?$("#redo"):$("#undo")).click();}
  else if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();$("#del").click();}
  else if(e.key==="Escape"){sel=null;render();}
});
new ResizeObserver(()=>setViewBox()).observe(svg);

document.getElementById("ver").textContent="v"+APP_VERSION;
render();fit();
</script>
